<svg xmlns="http://www.w3.org/2000/svg" width="760" height="190" viewBox="0 0 760 190" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <filter id="shadow" x="-5%" y="-20%" width="110%" height="150%">
      <feDropShadow dx="0" dy="1" stdDeviation="1" flood-color="#000" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- VS Code side panel -->
  <rect width="760" height="190" rx="12" fill="#181818"/>

  <!-- Gauge band, styled like the input -->
  <rect x="20" y="22" width="720" height="40" rx="8" fill="#252526" stroke="#3C3C3C" filter="url(#shadow)"/>
  <g font-size="12.5">
    <text x="38" y="46" fill="#9D9D9D">Session</text>
    <rect x="94" y="39.5" width="140" height="5" rx="2.5" fill="#8E8E93" fill-opacity="0.22"/>
    <rect x="94" y="39.5" width="61.6" height="5" rx="2.5" fill="#D97757"/>
    <text x="244" y="46" fill="#E6E6E6">44%</text>
    <text x="280" y="46" fill="#9D9D9D">↻ 20:00</text>

    <text x="380" y="46" fill="#9D9D9D">Weekly</text>
    <rect x="432" y="39.5" width="140" height="5" rx="2.5" fill="#8E8E93" fill-opacity="0.22"/>
    <rect x="432" y="39.5" width="9.8" height="5" rx="2.5" fill="#D97757"/>
    <text x="582" y="46" fill="#E6E6E6">7%</text>
    <text x="610" y="46" fill="#9D9D9D">↻ 7 Nov, 01:00</text>
  </g>

  <!-- Prompt input -->
  <rect x="20" y="74" width="720" height="96" rx="8" fill="#252526" stroke="#3C3C3C" filter="url(#shadow)"/>
  <text x="38" y="102" font-size="13.5" fill="#6E6E6E">Ask Claude to edit, explain or build…</text>
  <g font-size="12" fill="#8A8A8A">
    <text x="38" y="154">⏵⏵ Ask before edits</text>
    <text x="602" y="154">Opus · ◔ 12%</text>
  </g>
  <circle cx="716" cy="149" r="10" fill="#D97757"/>
  <path d="M716 154 V144 M711.5 148.5 L716 144 L720.5 148.5" stroke="#fff" stroke-width="1.8" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
